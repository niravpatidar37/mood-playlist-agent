name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest -q

      - name: Run integration tests (skipped without GROQ_API_KEY)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest tests/test_examples.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vibeforge-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: vibeforge-ui
        run: npm ci

      - name: Lint frontend
        working-directory: vibeforge-ui
        run: npm run lint

      - name: Build frontend
        working-directory: vibeforge-ui
        run: npm run build
